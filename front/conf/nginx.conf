events {}

http {
    # Extraer access_token de la cookie y armar el header Authorization
    map $http_cookie $auth_token {
        default "";
        "~*access_token=(?<token>[^;]+)" "Bearer $token";
    }
    server {
        listen 80;
        server_name localhost;
        location / {
            proxy_pass http://host.docker.internal:5173;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /_api/ {

            rewrite ^/_api/(.*)$ /initium-saas/$1 break;
            proxy_pass http://host.docker.internal:3000;

            # CORS headers
            add_header 'Access-Control-Allow-Methods' "GET, POST, OPTIONS, PUT, DELETE" always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;

            # Authorization desde cookie
            proxy_set_header Authorization $auth_token;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            rewrite ^/api/(.*)$ /initium-saas/$1 break;
            proxy_pass http://host.docker.internal:3000;

            # CORS headers
            add_header 'Access-Control-Allow-Methods' "GET, POST, OPTIONS, PUT, DELETE" always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
